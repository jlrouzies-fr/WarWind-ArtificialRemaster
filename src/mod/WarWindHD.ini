; War Wind HD settings
[Mod]
; Folder (inside the game folder) holding *.wwp byte-patch files
PatchDir=WarWindHD

[Controls]
; 1 = command-panel buttons use the key at their on-screen slot instead of the command's letter
GridHotkeys=1
; Keys for slots 0,1,2,... (left to right, top to bottom)
GridKeys=QWERTASDFGZXCVB
; 1 = Ctrl+digit assigns a control group (Shift+digit also still works)
CtrlGroups=1
; Missions scroll smoothly: arrow keys, screen edges, mouse wheel (Shift = sideways) and middle
; button drag move the camera pixel by pixel; minimap clicks and "centre on unit" glide there.
; ScrollSpeed = pixels per second for keys and edges, up to 1800 (0 = from the game's Screen Scroll Speed)
ScrollSpeed=0
EdgeScroll=1
WheelScroll=1
; pixels scrolled per wheel notch
WheelPixels=96
MiddleDrag=1
; Double-click a unit to select all visible units of that type
DoubleClickType=1
; 1 = right click moves/attacks with the selection (on an own unit: its command menu),
;     left click only selects, left click on empty ground deselects; on the minimap left
;     click / drag moves the camera and right click sends the selection there
ModernClicks=1

[Video]
; 1 = missions run at 1280x720: full-width map over a bottom HUD (menus stay 640x480)
HiRes=1
; 1 = accurate game clock: frames and game ticks every 62 ms as designed (16 per second)
;     instead of the original 20 ms sleep steps that make it 80 ms or more (12 per second)
PreciseClock=1
; Speed of that clock in percent of real time: 100 = the game's designed speed; about 70 matches
; how the unmodified game plays on current Windows. Lower = slower units and fewer game frames
; (the camera stays smooth either way). The in-game Game Speed slider applies on top.
GameSpeedPercent=70
; Frames per second shown between the game's own frames (camera, units, selection box; 0 = off)
PresentHz=60
; 1 = units glide between game frames at PresentHz instead of stepping at the game's frame rate
;     (their speed and animation timing do not change)
SmoothMotion=1

[UI]
; 1 = the bottom HUD shows the selection's commands as a 5x3 grid labelled with the grid
;     hotkeys; click a slot or press its key (replaces the command popup over the unit)
CommandGrid=1
; 1 = "Save Current Game" / "Load a Saved Game" open an in-game screen listing the saves in Saves\
;     (type a name to save, pick one to load, Del deletes) instead of the Windows file dialogs
InGameSaveLoad=1
; 1 = remastered widescreen menus: the main menu, race options, mission briefing and victory /
;     defeat screens fill a 960x540 mode (exactly 2x on 1080p, 4x on 4K) around their original art,
;     and the in-game (Esc) menu becomes a wide panel with the scenario goal; 0 = the original screens
WideMenus=1

[Graphics]
; Modern Graphics (needs the Direct3D 9 renderer: ddraw.ini renderer=auto or d3d9):
; soft shadows instead of the art's checkerboard ones, contact shading around buildings and
; trees, light and glow from fire, explosions and magic, animated water, soft fog of war and a
; colour grade.
Modern=1
; Key that switches it on and off in a mission (virtual-key code, 0x78 = F9)
ToggleKey=0x78
; Shadows: darkness under full shadow (0..1, 0.5 = half as bright), softness in pixels, direction of unit shadows
; (degrees below the horizontal, towards the right) and how far they fall from the unit, in pixels
ShadowOpacity=0.5
ShadowSoftness=3
SunAngle=35
ShadowLength=5
; Contact shading (ambient occlusion) around buildings, trees and units: strength 0..1, radius
AmbientOcclusion=0.45
AmbientOcclusionRadius=10
; Fog of war darkness (0..1, 0.5 = half as bright)
FogOpacity=0.45
; Water: wave distortion in pixels, sun glints and caustics, foam along shores (0 = off, 1 = default)
WaterWaves=0.8
WaterGlints=1.0
WaterFoam=1.0
; Brightness of the scene without lights (1 = original); lower makes fire and magic stand out
Ambient=0.92
; Light from fire, explosions and magic: strength, glow radius, extra bloom, light radius scale
LightIntensity=1.0
GlowRadius=5
Bloom=0.25
LightRadius=0.5
; Colour grade: 1 = unchanged contrast / saturation, 0 = no vignette / sharpening
Contrast=1.06
Saturation=1.08
Vignette=0.25
Sharpen=0.2

[Cutscenes]
; 1 = play Data\VIDS_HD\*.mp4 remasters when present
HDVideos=1

[Dev]
; 1 = accept developer commands from WarWindHD.cmd (capture/key/click/peek)
Commands=0
