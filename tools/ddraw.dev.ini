; cnc-ddraw - https://github.com/FunkyFr3sh/cnc-ddraw
; War Wind HD development profile: never changes the display mode.
[ddraw]
; image shown around 640x480 screens instead of black bars
backdrop=WarWindHD\backdrop.png
windowed=true
fullscreen=false
border=true
resizable=true
width=0
height=0
maintas=true
boxing=false
renderer=gdi
devmode=true
adjmouse=true
noactivateapp=true
nonexclusive=true
savesettings=0
posX=0
posY=0
; Disable every fullscreen toggle so nothing can ever call ChangeDisplaySettings
keytogglefullscreen=0x00
keytogglefullscreen2=0x00
keytogglemaximize=0x00
keytogglemaximize2=0x00
keyunlockcursor1=0x00
keyunlockcursor2=0x00
keyscreenshot=0x00

; Spoof Windows 95 so the game skips its "Windows NT is not supported" dialog
win_version=95

[WW]
minfps=-1
