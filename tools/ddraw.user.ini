; cnc-ddraw - https://github.com/FunkyFr3sh/cnc-ddraw
; War Wind HD profile: borderless window covering the screen, integer scaling, no display-mode change.
[ddraw]
; image shown around 640x480 screens instead of black bars
backdrop=WarWindHD\backdrop.png
windowed=true
fullscreen=true
toggle_borderless=true
boxing=true
maintas=true
renderer=auto
d3d9_filter=0
adjmouse=true
savesettings=0
nonexclusive=true
singlecpu=true
; Spoof Windows 95 so the game skips its "Windows NT is not supported" dialog
win_version=95

[WW]
minfps=-1
